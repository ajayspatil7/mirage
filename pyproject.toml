[tool.poetry]
name = "mirage"
version = "0.1.0"
description = "Syntheta ML Engine - Production-grade synthetic data generation"
authors = ["Syntheta Team <team@syntheta.ai>"]
readme = "README.md"
packages = [{include = "mirage"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.2"
httpx = "^0.25.2"
python-multipart = "^0.0.6"
# ML/DL Dependencies
torch = "^2.2.0"
torchvision = "^0.17.0"
numpy = "^1.24.3"
pandas = "^2.1.0"
scikit-learn = "^1.3.0"
# Synthetic Data
sdv = "^1.10.0"
# Metrics
scipy = "^1.11.0"
# Development
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.6.0"
psutil = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.1.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
